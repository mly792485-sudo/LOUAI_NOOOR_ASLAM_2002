name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Verify full JDK
        run: java -version && javac -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The deprecated `tools` package is no longer available on GitHub runners.
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install icon generation dependency
        run: python3 -m pip install --user Pillow

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Generate Android launcher icons
        run: python3 tools/generate_android_icons.py

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK, unsigned release APK and unsigned AAB
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-islam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-islam-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-islam-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct Android download release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: noor-android-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --title "Noor Al-Islam Android build ${{ github.run_number }}" \
            --notes "Debug APK, unsigned release APK, and unsigned AAB. App Store/Google Play signing is required for production distribution." \
            --latest=false
          echo '### Direct Android downloads' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the Android release page](https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
